        stroke-linejoin="round"
        filter="url(#neon-glow)"/>
        
  <!-- The Retention Curve Leg -->
  <path d="M 235 311 C 265 311 295 346 325 396 C 342 424 365 434 395 426" 
        stroke="#D1FE17" 
