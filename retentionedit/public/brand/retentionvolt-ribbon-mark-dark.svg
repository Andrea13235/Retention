      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#D1FE17" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- RetentionVolt - Dark Mode Ribbon Mark -->
  <rect width="512" height="512" rx="112" fill="#0B0C0E" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>
  
  <!-- Continuous Ribbon R in Neon Lime -->
  <path d="M 125 418 V 206 C 125 131 175 96 245 96 C 315 96 365 141 365 211 C 365 276 315 311 240 311 H 125" 
        stroke="#D1FE17" 
        stroke-width="52" 
