<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%" fill="none">
  <defs>
    <filter id="lockup-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#D1FE17" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Icon: Squircle with Black Ribbon -->
  <g transform="translate(10, 10)">
    <rect width="140" height="140" rx="32" fill="#D1FE17"/>
    <g transform="scale(0.2734)">
      <path d="M 125 418 V 206 C 125 131 175 96 245 96 C 315 96 365 141 365 211 C 365 276 315 311 240 311 H 125" 
            stroke="#000000" 
            stroke-width="52" 
            stroke-linecap="butt" 
            stroke-linejoin="round"/>
      <path d="M 235 311 C 265 311 295 346 325 396 C 342 424 365 434 395 426" 
            stroke="#000000" 
            stroke-width="52" 
            stroke-linecap="butt" 
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Right Wordmark -->
  <g transform="translate(180, 96)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">RETENTION</tspan>
      <tspan fill="#D1FE17" dx="6" filter="url(#lockup-neon-glow)">EDIT</tspan>
    </text>
  </g>
</svg>
