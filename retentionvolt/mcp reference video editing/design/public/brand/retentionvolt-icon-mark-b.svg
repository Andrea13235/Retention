<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="neon-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5FF55" />
      <stop offset="100%" stop-color="#D1FE17" />
    </linearGradient>
    <filter id="glow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#D1FE17" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark container -->
  <rect width="44" height="44" rx="10" fill="#0A0B0E" stroke="#1F222A" stroke-width="1.2"/>

  <!-- Top-Right Bin Half (Frame & Loop) -->
  <path d="M 12 7 H 34 C 35.657 7 37 8.343 37 10 V 22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Razor Diagonal Cut Guide -->
  <line x1="33" y1="9" x2="11" y2="33" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="14" x2="16" y2="36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Bottom-Left Bin Half -->
  <path d="M 8 20 V 34 C 8 35.657 9.343 37 11 37 H 24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Retention Curve Wave (surging through lower left into center) -->
  <path d="M 10 35 C 13 35 14 26 17 24 C 20 22 23 30 27 30 C 29.5 30 32 28.5 34 26" 
        stroke="url(#neon-fade)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow-b)"/>
  
  <circle cx="34" cy="26" r="2.2" fill="#D1FE17"/>
</svg>
